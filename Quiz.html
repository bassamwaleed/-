        }

            background: #764ba2;

            padding: 5px 15px;

            font-size: 0.9em;
            margin-bottom: 15px;
            display: inline-block;
        }

            margin-bottom: 30px;
            color: #2c3e50;
            font-weight: bold;
            line-height: 1.5;
        }

        .options {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .option-btn {
            padding: 18px;
            border: 2px solid #e0e0e0;
            background: white;
            border-radius: 12px;
            cursor: pointer;
            font-size: 1.1em;
            font-family: 'Tajawal', sans-serif;
            transition: all 0.2s ease;
            color: #555;
            position: relative;
            overflow: hidden;
        }

        .option-btn:hover:not(:disabled) {
            background-color: #f8f9fa;
            border-color: #764ba2;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
        }

        .option-btn:disabled {
            cursor: default;
            transform: none;
        }

        .option-btn.correct {
            background-color: #d4edda;
            border-color: #28a745;
            color: #155724;
        }

        .option-btn.wrong {
            background-color: #f8d7da;
            border-color: #dc3545;
            color: #721c24;
        }

        .score-area {
            margin-top: 25px;
            font-weight: bold;
            color: #764ba2;
            font-size: 1.1em;
        }

        .back-btn {
            display: inline-block;
            margin-top: 25px;
            color: #888;
            text-decoration: none;
            font-size: 0.9em;
            transition: color 0.3s;
        }

        }

        .progress-bar {
            height: 6px;
            background: #eee;
            border-radius: 3px;
            margin-bottom: 25px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;

            justify-content: center;

                "a": 2
            },
            {
                "t": "من التقسيمات الاقتصادية للنفقات العامة كل ما يلى ما عدا",
                "o": ["الحقيقية", "التحويلية", "الجارية", "التدخلية"],
                "a": 3
            },
            {
                "t": "تعمل السياسة المالية لعلاج الفجوة الانكماشية على خفض",
                "o": ["الانفاق العام", "الطلب الكلى", "التوظف", "الضرائب"],
                "a": 3
            },
            {
                "t": "في حالة اتباع سياسة مالية توسعية ينتقل منحنى AD الى",
                "o": ["الأسفل", "الأعلى", "اليسار", "اليمين"],
                "a": 3
            },
            {
                "t": "تعبر حالة انتقال منحنى AD1 الى AD2 عن زيادة",
                "o": ["العرض الكلى", "الطلب الكلى", "الادخار", "الاستهلاك"],
                "a": 1
            }
        ];

        let currentQuestion = 0;
        let score = 0;

        // تحديث العدد الكلي للأسئلة في الواجهة
        document.getElementById('q-total').innerText = questions.length;

        function loadQuestion() {
            const q = questions[currentQuestion];
            document.getElementById('question-text').innerText = q.t; // استخدام t بدلاً من text
            document.getElementById('q-curr').innerText = currentQuestion + 1;
            
            // تحديث شريط التقدم
            const progress = ((currentQuestion) / questions.length) * 100;
            document.getElementById('progress-fill').style.width = `${progress}%`;

            const container = document.getElementById('options-container');
            container.innerHTML = '';

            q.o.forEach((opt, index) => { // استخدام o بدلاً من options
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerText = opt;
                btn.onclick = () => checkAnswer(index, btn);
                container.appendChild(btn);
            });
        }

        function checkAnswer(selectedIndex, btnElement) {
            const allBtns = document.querySelectorAll('.option-btn');
            allBtns.forEach(b => b.disabled = true);

            const correctIndex = questions[currentQuestion].a; // استخدام a بدلاً من answer

            if (selectedIndex === correctIndex) {
                btnElement.classList.add('correct');
                score++;
            } else {
                btnElement.classList.add('wrong');
                allBtns[correctIndex].classList.add('correct');
            }

            document.getElementById('score-text').innerText = `النتيجة: ${score} من ${questions.length}`;

            // الانتقال التلقائي بعد ثانية ونصف
            setTimeout(() => {
                currentQuestion++;
                if (currentQuestion < questions.length) {
                    loadQuestion();
                } else {
                    document.getElementById('progress-fill').style.width = '100%';
                    document.getElementById('quiz-container').innerHTML = `
                        <h5>🎉 انتهى الامتحان!
                            متنسانيش بدعوه حلوه و صلي علي النبي</h5>
                        <p style="font-size:1.5em; margin: 20px 0;">نتيجتك النهائية: <br> <strong>${score}</strong> من <strong>${questions.length}</strong></p>
                        <button class="option-btn" onclick="location.reload()" style="background:#764ba2; color:white; border:none;">إعادة الاختبار</button>
                    `;
                }
            }, 1500);
        }

        loadQuestion();
    </script>
