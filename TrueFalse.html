            border-radius: 20px;
            cursor: pointer;
            font-family: 'Tajawal', sans-serif;
            font-size: 0.9em;
            margin-bottom: 20px;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }

        .shuffle-btn:hover {
            background-color: #e2e6ea;
        }

        .shuffle-btn.active {
            background-color: #667eea;
            color: white;
            border-color: #667eea;
        }

            font-size: 0.9em;
            margin-bottom: 15px;
            display: inline-block;

            align-items: center;
            justify-content: center;

            gap: 20px;
            justify-content: center;
            margin-bottom: 20px;
        }

            flex: 1;
            padding: 20px;
            border: 2px solid #e0e0e0;
            border-radius: 15px;
            cursor: pointer;
            font-size: 1.5em;
            font-family: 'Tajawal', sans-serif;
            font-weight: bold;
            transition: all 0.2s ease;
            background: white;
            color: #555;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .tf-btn:hover:not(:disabled) {
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .btn-true:hover:not(:disabled) {
            background-color: #d4edda;
            border-color: #28a745;
            color: #155724;
        }

        .btn-false:hover:not(:disabled) {
            background-color: #f8d7da;
            border-color: #dc3545;
            color: #721c24;
        }

        .tf-btn.correct-answer {
            background-color: #28a745 !important;
            border-color: #28a745 !important;
            color: white !important;
        }

        .tf-btn.wrong-answer {
            background-color: #dc3545 !important;
            border-color: #dc3545 !important;
            color: white !important;
            opacity: 0.7;
        }
        
        .tf-btn.show-correct {
            background-color: #28a745 !important;
            border-color: #28a745 !important;
            color: white !important;
            opacity: 0.8;
        }

        .tf-btn:disabled {
            cursor: default;
            transform: none;
        }

        .score-area {

            font-weight: bold;
            color: #764ba2;
            font-size: 1.1em;
        }

        .back-btn {

            max-height: 300px;

            line-height: 1.4;

        }
    </style>
</head>

        // تعيين الأرقام التعريفية للأسئلة
        originalQuestions.forEach((q, index) => {
            q.id = index + 1;
        });

        // مصفوفة الأسئلة الحالية (قابلة للتغيير)
        let questions = [...originalQuestions];
        let currentQuestion = 0;
        let score = 0;
        let isRandom = false; // حالة الترتيب
        let wrongAnswers = []; // لتخزين الإجابات الخاطئة

        // تحديث العدد الكلي للأسئلة
        document.getElementById('total-q').innerText = questions.length;

        // دالة تبديل الترتيب
        function toggleShuffle() {
            isRandom = !isRandom;
            const btn = document.getElementById('shuffle-btn');
            
            if (isRandom) {
                // خلط الأسئلة
                for (let i = questions.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [questions[i], questions[j]] = [questions[j], questions[i]];
                }
                btn.innerHTML = "<span>🔀</span> ترتيب الأسئلة: عشوائي";
                btn.classList.add('active');
            } else {
                // إعادة الترتيب الأصلي
                questions = [...originalQuestions];
                btn.innerHTML = "<span>🔢</span> ترتيب الأسئلة: مرتب";
                btn.classList.remove('active');
            }

            // إعادة ضبط الاختبار
            restartQuiz();
        }

        // دالة إعادة تشغيل الاختبار عند تغيير الترتيب
        function restartQuiz() {
            currentQuestion = 0;
            score = 0;
            wrongAnswers = []; // تصفير الأخطاء
            
            // إعادة بناء واجهة الأسئلة
            document.getElementById('quiz-container').innerHTML = `
                <div class="question" id="question-text">جاري تحميل الأسئلة...</div>
                
                <div class="tf-buttons">
                    <button class="tf-btn btn-true" id="btn-0" onclick="checkAnswer(0)">
                        ✅ صواب

                    <button class="tf-btn btn-false" id="btn-1" onclick="checkAnswer(1)">
                        ❌ خطأ

            `;

        }

        function loadQuestion() {
            const q = questions[currentQuestion];
            // عرض رقم السؤال المرتبط بالسؤال (q.id)
            document.getElementById('question-text').innerText = q.id + ". " + q.t;
            document.getElementById('q-curr').innerText = currentQuestion + 1;
            
            const progress = ((currentQuestion) / questions.length) * 100;
            document.getElementById('progress-fill').style.width = `${progress}%`;

            // إعادة تفعيل الأزرار
            const btns = document.querySelectorAll('.tf-btn');
            btns.forEach(btn => {
                btn.disabled = false;
                btn.classList.remove('correct-answer', 'wrong-answer', 'show-correct');
            });
        }

        function checkAnswer(userChoice) {
            const btns = document.querySelectorAll('.tf-btn');
            btns.forEach(btn => btn.disabled = true);

            const correctChoice = questions[currentQuestion].a; // 0 أو 1 (0=صواب, 1=خطأ)
            const selectedBtn = document.getElementById('btn-' + userChoice);
            const correctBtn = document.getElementById('btn-' + correctChoice);

            if (userChoice === correctChoice) {
                selectedBtn.classList.add('correct-answer');
                score++;
            } else {
                selectedBtn.classList.add('wrong-answer');
                correctBtn.classList.add('show-correct');
                
                // تسجيل الإجابة الخاطئة
                wrongAnswers.push({
                    q: questions[currentQuestion].t,
                    selected: userChoice === 0 ? "صواب" : "خطأ",
                    correct: correctChoice === 0 ? "صواب" : "خطأ",
                    qNum: questions[currentQuestion].id // استخدام الرقم الأصلي
                });
            }

            document.getElementById('score-text').innerText = `النتيجة: ${score} من ${questions.length}`;

            // الانتقال التلقائي
            setTimeout(() => {
                currentQuestion++;
                if (currentQuestion < questions.length) {
                    loadQuestion();
                } else {
                    showFinalResult();
                }
            }, 1200);
        }

        function showFinalResult() {
            document.getElementById('progress-fill').style.width = '100%';
            
            let resultHTML = `
                <h3>🎉 انتهى الامتحان!</h3>
                <p style="font-size:1.5em; margin: 20px 0;">نتيجتك النهائية: <br> <strong>${score}</strong> من <strong>${questions.length}</strong></p>
                <button class="tf-btn" onclick="restartQuiz()" style="background:#764ba2; color:white; border:none; width:auto; padding: 15px 30px;">إعادة الاختبار</button>
            `;

            // زر عرض الأخطاء إذا وجدت
            if (wrongAnswers.length > 0) {
                resultHTML += `
                    <br>
                    <button class="tf-btn" onclick="showMistakes()" style="background:#e74c3c; color:white; border:none; width:auto; padding: 15px 30px; margin-top: 10px;">عرض الإجابات الخاطئة</button>
                `;
            }

            document.getElementById('quiz-container').innerHTML = resultHTML;
        }

        function showMistakes() {
            let mistakesHTML = `<h3>ملخص الأخطاء</h3><div class="mistakes-container">`;
            
            wrongAnswers.forEach(item => {
                mistakesHTML += `
                    <div class="mistake-item">
                        <div class="mistake-q">س${item.qNum}: ${item.q}</div>
                        <div class="mistake-wrong">❌ إجابتك: ${item.selected}</div>
                        <div class="mistake-correct">✅ الصح: ${item.correct}</div>
                    </div>
                `;
            });

            mistakesHTML += `</div><button class="tf-btn" onclick="restartQuiz()" style="background:#764ba2; color:white; border:none; width:auto; padding: 15px 30px; margin-top: 15px;">إعادة الاختبار</button>`;
            
            document.getElementById('quiz-container').innerHTML = mistakesHTML;
        }

        loadQuestion();
    </script>

</body>
</html>
